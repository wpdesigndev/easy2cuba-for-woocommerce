}

function fillCountries(){
  const sel = $("b_pais"), cur = sel.value;
  const list = ISO.map(c=>[c,cname(c)]).sort((a,b)=>a[1].localeCompare(b[1],L));
  sel.innerHTML = `<option value="">${t("cPick")}</option>` + list.map(([c,n])=>`<option value="${c}">${n.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</option>`).join("");
  sel.value = cur;

function detectCountry(fromUser){
  const el = $("b_pref");
  const d = el.value.replace(/\D/g,"").slice(0,4);
  el.value = d ? "+"+d : "";
  billCountry = "";
  if(!d) return;
  let k = d; while(k && !CODES[k]) k = k.slice(0,-1);
  if(!k) return;
  const codes = CODES[k].split(" ");
  billCountry = codes[0];
  if(fromUser !== true) return;
  const sel = $("b_pais");
  if(codes.includes(sel.value)) return;
  sel.value = codes[0]; setErr(sel,"");
}
$("b_pref").addEventListener("input", ()=>detectCountry(true));

function setErr(el,msg){
  const f = el.closest(".f"); if(!f) return;
  f.classList.toggle("bad",!!msg);
  let m = f.querySelector(".msg");
  if(msg){ if(!m){ m=document.createElement("span"); m.className="msg"; f.appendChild(m);} m.textContent=msg; }
  else if(m) m.remove();
}
const digits = v => v.replace(/\D/g,"");
const rules = {
  b_email: v => /^\S+@\S+\.\S+$/.test(v) ? "" : t("eEmail"),
  b_tel: v => !v || billCountry ? "" : t("ePref"),
  s_tel: v => /^\d{8}$/.test(digits(v)) ? "" : t("eCu"),
  s_fijo: v => !v || /^\d{8}$/.test(digits(v)) ? "" : t("eCu"),
  s_ci: v => !v || /^\d{11}$/.test(v) ? "" : t("eCi")
};
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
$("checkout").addEventListener("submit", e => {
  e.preventDefault();
  let first = null;
  ["b_nombre","b_apellidos","b_email","b_tel","b_dir","b_pais","s_nombre","s_apellidos","s_tel","s_fijo","s_ci","s_prov","s_mun","s_calle","s_entre"].forEach(id => {
    const el = $(id), v = el.value.trim();
    let msg = el.required && !v ? t("eReq") : (rules[id] ? rules[id](v) : "");
    setErr(el,msg);
    if(msg && !first) first = el;
  });
  const cs = $("s_consent"), cf = cs.closest(".f");
  if(!cf.hidden && !cs.checked){ cf.classList.add("bad"); let m=cf.querySelector(".msg"); if(!m){m=document.createElement("span");m.className="msg";cf.appendChild(m);} m.textContent=t("eConsent"); if(!first) first=cs; } else { cf.classList.remove("bad"); cf.querySelector(".msg")?.remove(); }
  const out = $("out");
  if(first){ out.hidden = true; first.focus(); first.scrollIntoView({block:"center",behavior:"smooth"}); return; }
  const rows = [
    [t("rBuys"), $("b_nombre").value+" "+$("b_apellidos").value+($("b_pais").value?" · "+cname($("b_pais").value):"")],
    [t("rGets"), $("s_nombre").value+" "+$("s_apellidos").value],
    [t("rPhones"), t("rMob")+" +53 "+$("s_tel").value+($("s_fijo").value?" · "+t("rLand")+" +53 "+$("s_fijo").value:"")],
    [t("rAddr"), $("s_calle").value+", "+$("s_entre").value+($("s_reparto").value?", "+$("s_reparto").value:"")],
    [t("rPlace"), mun.value+", "+prov.value],
    [t("shipping"), $("ship").textContent],
    ["Total", $("total").textContent]
  ];
  out.className = "result"; out.hidden = false;
  out.innerHTML = `<h3>${t("rTitle")}</h3><dl>`+rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")+"</dl>";
  addInvoiceFromForm();
});

$("inv-save").addEventListener("click",()=>{
  invCopyCustom = $("inv-copy").value.trim() || null;
  $("inv-saved").hidden=false; setTimeout(()=>$("inv-saved").hidden=true,2500); renderInv();
});
$("inv-copy").addEventListener("input",()=>{ invCopyCustom = $("inv-copy").value; });

function row(label,val,wide){ return val ? `<div${wide?' class="wide"':''}><span>${label}</span><b>${esc(val)}</b></div>` : ""; }
function invoiceHTML(v){
  const sub = sumItems(v);
  return `<div class="pp-head">
      <div class="pp-store">${invLogo?`<img class="pp-logo" src="${invLogo}" alt="${t("mystore")}">`:`${t("mystore")}<small>${t("siteNote")}</small>`}</div>
      <div class="pp-meta"><div class="pp-title">${t("pInvoice")}</div>
        <div>${t("pNo")} <b>${v.no}</b></div><div>${t("pOrder")} <b>#${v.order}</b></div><div>${t("pDate")} <b>${fmtDate(v.date)}</b></div></div>
    </div>
    <section class="pp-deliver"><h4>${t("pDeliver")}</h4><div class="pp-grid">
      ${row(t("pName"), v.rec.n+" "+v.rec.l, true)}
      ${row(t("pMobile"), v.rec.mobile)}${row(t("pLand"), v.rec.land)}
      ${row(t("pCi"), v.rec.ci)}
      ${row(t("pProv"), v.rec.prov)}${row(t("pMun"), v.rec.mun)}
      ${row(t("pStreet"), v.rec.street, true)}
      ${row(t("pBetween"), v.rec.between)}${row(t("pReparto"), v.rec.reparto)}
      ${row(t("pRefs"), v.rec.refs, true)}
    </div></section>
    <section class="pp-buyer"><h4>${t("pBuyer")}</h4><div class="pp-grid">
      ${row(t("pName"), v.buyer.n+" "+v.buyer.l)}${row(t("pEmail"), v.buyer.email)}
      ${row(t("pPhone"), v.buyer.phone)}
      ${row(t("pAddr"), v.buyer.addr, true)}
      ${row(t("pCountry"), v.buyer.country)}
    </div></section>
    <table class="pp-table"><thead><tr><th>${t("pProd")}</th><th class="r">${t("pQty")}</th><th class="r">${t("pPrice")}</th><th class="r">Total</th></tr></thead>
      <tbody>${v.items.map(([k,q,pr])=>`<tr><td>${t(k)}</td><td class="r">${q}</td><td class="r">${money2(pr/q)}</td><td class="r">${money2(pr)}</td></tr>`).join("")}</tbody></table>
    <div class="pp-totals"><span>${t("subtotal")}</span><span>${money2(sub)}</span>
      <span>${t("shipping")} · ${esc(v.rec.prov)}</span><span>${v.ship===0?t("free"):money2(v.ship)}</span>
      <span class="t">Total</span><span class="t">${money2(sub+v.ship)}</span></div>
    <section class="pp-sec"><h4>${t("pPay")}</h4><p>${esc(v.pay)}</p></section>
    ${v.notes?`<section class="pp-sec"><h4>${t("pNotes")}</h4><p>${esc(v.notes)}</p></section>`:""}
    <div class="pp-foot">${esc(copyText())}</div>`;
}
let lastFocus=null;
function openInvoice(i){
  const v = INVOICES[i]; if(!v) return;
  lastFocus = document.activeElement;
  $("m-title").textContent = `${t("pInvoice")[0]+t("pInvoice").slice(1).toLowerCase()} ${v.no}`;
  $("paper").innerHTML = invoiceHTML(v);
  $("modal").hidden = false; $("m-close").focus();
}
function closeModal(){ $("modal").hidden = true; lastFocus?.focus?.(); }
$("m-close").addEventListener("click", closeModal);
$("modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("modal").hidden) closeModal(); });
$("m-dl").addEventListener("click", ()=>toast(t("dlNote")));

let toastTimer;
function toast(msg){
  let el = document.querySelector(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,3000);
}

function addInvoiceFromForm(){
  if(!$("inv-on").checked) return;
  const no = "FAC-"+String(nextNo++).padStart(4,"0");
  const pad = n=>String(n).padStart(2,"0"); const d=new Date();
  const payLabel = document.querySelector('.pay input:checked')?.closest("label")?.textContent.trim() || "";
  const email = $("inv-email").value.trim() || "admin@mitienda.com";
  INVOICES.unshift({no, order:nextOrder++, date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`, sentTo:email, pay:payLabel, notes:$("notas").value.trim(),
    buyer:{n:$("b_nombre").value,l:$("b_apellidos").value,email:$("b_email").value,phone:$("b_tel").value?($("b_pref").value+" "+$("b_tel").value):"",country:$("b_pais").value?cname($("b_pais").value):"",addr:$("b_dir").value},
    rec:{n:$("s_nombre").value,l:$("s_apellidos").value,mobile:"+53 "+$("s_tel").value,land:$("s_fijo").value?"+53 "+$("s_fijo").value:"",ci:$("s_ci").value,street:$("s_calle").value,between:$("s_entre").value,reparto:$("s_reparto").value,mun:mun.value,prov:prov.value,refs:$("s_ref").value},
    items:ITEMS.map(x=>x.slice()), ship:PRICES[prov.value]||0});
  renderInv();
  toast(t("sentTo").replace("{n}",no).replace("{e}",email));
}

// Logo de la factura
let invLogo = null;
function renderLogo(){
  $("logo-box").innerHTML = invLogo ? `<img src="${invLogo}" alt="">` : `<span>${t("noLogo")}</span>`;
  $("logo-rm").hidden = !invLogo;
}
$("logo-file").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  if(!/^image\//.test(f.type)){ toast(t("logoBad")); return; }
  const r = new FileReader(); r.onload = ()=>{ invLogo = r.result; renderLogo(); }; r.readAsDataURL(f);
  e.target.value = "";
});
$("logo-rm").addEventListener("click", ()=>{ invLogo = null; renderLogo(); });

// Información
function renderInfo(){}
$("copy-mail").addEventListener("click", ()=>{
  const txt = $("sup-mail").textContent;
  const done = ()=>toast(t("copied"));
  try { navigator.clipboard.writeText(txt).then(done, ()=>{ selectMail(); }); } catch(e){ selectMail(); }
});
function selectMail(){ const r=document.createRange(); r.selectNodeContents($("sup-mail")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }

// Pestañas de administración
document.querySelectorAll(".atabs button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".atabs button").forEach(x=>x.setAttribute("aria-selected", x===b));
  document.querySelectorAll(".apanel").forEach(pn=>pn.hidden = pn.id!==b.dataset.panel);
  $("saved").hidden = true; $("saved-top").hidden = true;
}));

// Ajustes generales, SMTP y prueba de envío
$("set-consent").addEventListener("change", ()=>{ const f=$("s_consent").closest(".f"); f.hidden = !$("set-consent").checked; if(f.hidden){ $("s_consent").checked=false; f.classList.remove("bad"); f.querySelector(".msg")?.remove(); } });
$("smtp-on").addEventListener("change", ()=>{ $("smtp-fields").hidden = !$("smtp-on").checked; });
$("test-send").addEventListener("click", ()=>toast(t("testSent").replace("{e}", $("test-to").value.trim() || "admin@mitienda.com")));
$("test-view").addEventListener("click", ()=>{
  const base = INVOICES[INVOICES.length-1]; if(!base) return;
  const v = Object.assign({}, base, {no:"FAC-0000", order:1000});
  lastFocus = document.activeElement;
  $("m-title").textContent = t("testView");
  $("paper").innerHTML = invoiceHTML(v);
  $("modal").hidden = false; $("m-close").focus();
});

applyLang();
